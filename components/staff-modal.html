<!-- School staff contacts modal -->
<div
  id="staffModal"
  class="fixed inset-0 z-50 hidden items-end justify-center bg-ink/60 p-0 backdrop-blur-sm sm:items-center sm:p-6"
  role="dialog"
  aria-modal="true"
  aria-labelledby="staffTitle"
>
  <div
    class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-t-2xl bg-white shadow-lift ring-1 ring-ink/5 sm:rounded-2xl"
  >
    <div
      class="sticky top-0 z-10 flex items-start justify-between border-b border-ink/8 bg-white/95 px-6 py-5 backdrop-blur-md sm:px-8"
    >
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-coral">
          Admin access
        </p>
        <h2
          id="staffTitle"
          class="mt-1.5 font-display text-2xl font-bold tracking-tight text-ink sm:text-3xl"
        >
          School staff contacts
        </h2>
      </div>
      <button
        type="button"
        id="closeStaff"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-mist text-ink/50 transition hover:bg-ink/10 hover:text-ink"
        aria-label="Close"
      >
        <span class="text-xl leading-none">&times;</span>
      </button>
    </div>

    <div class="p-6 sm:p-8">
      <!-- Gate -->
      <div id="staffGate">
        <p class="text-sm leading-6 text-muted">
          Teacher and staff numbers are restricted. Enter the admin passcode
          to continue.
        </p>
        <form id="staffGateForm" class="mt-5 flex flex-col gap-3 sm:flex-row">
          <input
            type="password"
            id="staffPasscode"
            autocomplete="current-password"
            placeholder="Admin passcode"
            class="w-full rounded-xl border border-ink/15 px-4 py-3 text-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"
          />
          <button
            type="submit"
            class="rounded-full bg-ink px-6 py-3 text-sm font-bold text-white transition hover:bg-[#1a4543]"
          >
            Unlock
          </button>
        </form>
        <p id="staffGateError" class="mt-3 hidden text-sm font-medium text-coral">
          Incorrect passcode.
        </p>
      </div>

      <!-- List (hidden until unlocked) -->
      <div id="staffContent" class="hidden">
        <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-muted">
          Teachers
        </p>
        <div id="teachersList" class="grid gap-2 sm:grid-cols-2"></div>

        <p class="mb-3 mt-8 text-xs font-semibold uppercase tracking-wider text-muted">
          Workers &amp; support
        </p>
        <div id="workersList" class="grid gap-2 sm:grid-cols-2"></div>
      </div>
    </div>
  </div>
</div>
