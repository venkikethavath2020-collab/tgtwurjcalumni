<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Photo gallery for the TGTWURJC Grand Reunion 2026"
    />
    <title>Gallery | TGTWURJC Grand Reunion 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#153B3A",
              coral: "#F46352",
              sun: "#FFD166",
              mist: "#F7F4EC",
            },
            fontFamily: { display: ["Georgia", "serif"] },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-mist text-ink antialiased">
    <header class="bg-ink text-white">
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 lg:px-8"
      >
      <div id="siteBrand"></div>
        <div class="flex items-center gap-5">
          <a
            href="../upload/"
            class="hidden text-sm font-bold text-white/80 hover:text-sun sm:block"
            >Share a photo</a
          >
          <a
            href="../"
            class="rounded-md bg-sun px-4 py-2 text-sm font-bold text-ink transition hover:bg-white"
            >Back home</a
          >
        </div>
      </nav>
    </header>

    <main class="mx-auto max-w-7xl px-5 py-14 lg:px-8 lg:py-20">
      <p class="text-sm font-bold uppercase tracking-[.18em] text-coral">
        TGTWURJC Grand Reunion 2026
      </p>

      <div
        class="mt-4 flex flex-col justify-between gap-5 sm:flex-row sm:items-end"
      >
        <div>
          <h1 class="font-display text-4xl font-bold sm:text-5xl">
            Every shared moment.
          </h1>
          <p class="mt-3 max-w-xl text-lg leading-8 text-ink/70">
            A living album made by the TGTWURJC alumni community.
          </p>
        </div>
        <a
          href="../upload/"
          class="w-fit rounded-md bg-coral px-5 py-3 text-sm font-bold text-white transition hover:bg-[#dc4f41]"
          >Upload photos</a
        >
      </div>

      <!-- Batch Filter Dropdown -->
      <div class="mt-8 flex flex-wrap items-center gap-3">
        <label for="batchFilter" class="text-sm font-bold text-ink/80">
          Filter by batch:
        </label>
        <select
          id="batchFilter"
          class="rounded-md border border-ink/20 bg-white px-4 py-2.5 text-sm font-medium text-ink shadow-sm focus:border-coral focus:outline-none focus:ring-2 focus:ring-coral/30"
        >
          <option value="">All batches</option>
          <option value="2007">2007</option>
          <option value="2008">2008</option>
          <option value="2009">2009</option>
          <option value="2010">2010</option>
          <option value="2011">2011</option>
          <option value="2012">2012</option>
          <option value="2013">2013</option>
        </select>
      </div>

      <div
        id="galleryGrid"
        class="mt-10 columns-2 gap-3 sm:columns-3 lg:columns-4"
      ></div>

      <p
        id="galleryState"
        class="hidden mx-auto mt-10 max-w-md text-center text-lg leading-8 text-ink/70"
      ></p>

      <button
        id="loadMore"
        class="mx-auto mt-10 hidden rounded-full bg-ink px-5 py-3 text-sm font-bold text-white transition hover:bg-[#245553]"
      >
        Load more memories
      </button>
    </main>

    <script type="module">
      import { initGallery } from "../js/gallery.js";
      import { initSiteBrand } from "../js/site-brand.js";
      initGallery();

      initSiteBrand('#siteBrand', {
      href: '/',
      logoSrc: '../assets/logo.png',
      logoAlt: 'TGTWURJC',
    });
    </script>
  </body>
</html>
